services:
  postgres:
    # pgvector/pgvector, not stock postgres: V7 does CREATE EXTENSION vector, and pgvector
    # is not bundled with the official image. This one is the official image plus the
    # extension, so pg_trgm (contrib) still comes along.
    image: pgvector/pgvector:pg16
    container_name: slangdump-postgres
    environment:
      POSTGRES_DB: slangdump
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  spring:
    build: 
      context: ./slangdump-pick-n-roll
    container_name: slangdump-backend
    ports:
      - "8080:8080"
    environment:
      # The image defaults SPRING_PROFILES_ACTIVE=prod (see slangdump-pick-n-roll/Dockerfile)
      # so a deployment can't accidentally boot unguarded. Local compose doesn't supply
      # AUTH_JWT_PUBLIC_KEY, so it deliberately overrides back to a non-prod profile here —
      # otherwise ProductionKeyGuard would resolve the dev key and refuse to start.
      - SPRING_PROFILES_ACTIVE=local
      # application.yml defaults spring.flyway.enabled=false (production migrates via the
      # release_command's 'migrate' profile). Local is single-instance with no PgBouncer,
      # so startup migration is safe and convenient — opt back in here.
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/slangdump
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - AI_WORKER_URL=http://ai-worker:8000
      # Post images go to the floci S3 emulator instead of R2. The endpoint is the
      # in-network name Spring writes to; the public base URL is what the reader's browser
      # loads, so it is the host-mapped port. The 'local' profile creates the bucket.
      - STORAGE_R2_ENDPOINT=http://floci:4566
      - STORAGE_R2_BUCKET=slangdump-images
      - STORAGE_R2_ACCESS_KEY_ID=test
      - STORAGE_R2_SECRET_ACCESS_KEY=test
      - STORAGE_R2_PUBLIC_BASE_URL=http://localhost:4566/slangdump-images
    depends_on:
      - postgres
      - ai-worker
      - floci
    restart: unless-stopped


  # Local stand-in for Cloudflare R2 (S3 API). No docker.sock mount: that is only for
  # floci's container-backed services, and this stack uses S3 alone.
  floci:
    image: floci/floci:latest
    container_name: slangdump-floci
    ports:
      - "4566:4566"
    environment:
      - FLOCI_HOSTNAME=floci
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
    volumes:
      - floci_data:/app/data
    restart: unless-stopped

  ai-worker:
    build:
      context: ./slangdump-ai-solation
    # Image CMD already binds 0.0.0.0 (see slangdump-ai-solation/Dockerfile — Fly Proxy
    # reaches the app over IPv4), which also works over Docker's IPv4 Compose bridge, so
    # no command override is needed here.
    container_name: slangdump-ai-worker
    ports:
      - "8000:8000"
    env_file:
      - ./slangdump-ai-solation/.env
    restart: unless-stopped

volumes:
  postgres_data:
  floci_data:
